  # ============================================
  finalize:
    needs:
      - detect-changes
      - publish-core
      - publish-coreui
      - publish-files
      - publish-notifications
      - publish-phonecore
      - publish-camera
      - publish-mediaplayers
      - publish-youtube
      - publish-phoneui
      - publish-imagepicker
    if: always() && needs.detect-changes.outputs.any_module == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Download all version catalog artifacts
        uses: actions/download-artifact@v4
        with:
          path: version-catalogs
          pattern: version-catalog-*

      - name: Merge version catalogs
        run: |
          VERSION="${{ env.VERSION_PREFIX }}.${{ github.run_number }}${{ env.VERSION_SUFFIX }}"
          echo "Merging version catalogs with version: $VERSION"

          # Start with the base version catalog
          cp gradle/libs.versions.toml gradle/libs.versions.toml.merged

          # Apply updates from each published module
          update_version() {
            local module=$1
            local version_key=$2
            if [ -f "version-catalogs/version-catalog-$module/libs.versions.toml" ]; then
              echo "Updating $version_key to $VERSION"
              sed -i '' "s/$version_key = \"[^\"]*\"/$version_key = \"$VERSION\"/" gradle/libs.versions.toml.merged
            fi
          }

          update_version "core" "metacto-core"
          update_version "coreui" "metacto-coreui"
          update_version "files" "metacto-files"
          update_version "notifications" "metacto-notifications"
          update_version "phonecore" "metacto-phonecore"
          update_version "camera" "metacto-camera"
          update_version "mediaplayers" "metacto-mediaplayers"
          update_version "youtube" "metacto-youtube"
          update_version "phoneui" "metacto-phoneui"
          update_version "imagepicker" "metacto-imagepicker"

          mv gradle/libs.versions.toml.merged gradle/libs.versions.toml

          echo "Updated version catalog:"
          head -30 gradle/libs.versions.toml

      - name: Update local properties
        env:
          PUBLISH_REPO_USER: ${{ secrets.PUBLISH_REPO_USER }}
          PUBLISH_REPO_TOKEN: ${{ secrets.PUBLISH_REPO_TOKEN }}
        run: |
          echo "PUBLISH_REPO_USER=$PUBLISH_REPO_USER" > ./local.properties
          echo "PUBLISH_REPO_TOKEN=$PUBLISH_REPO_TOKEN" >> ./local.properties

      - name: Publish version catalog
        run: ./gradlew :version-catalog:publishAllPublicationsToGithubRepository

      - name: Commit and push updated version catalog
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add gradle/libs.versions.toml

          # Build commit message with list of updated modules
          MODULES=""
          [ -d "version-catalogs/version-catalog-core" ] && MODULES="$MODULES core"
          [ -d "version-catalogs/version-catalog-coreui" ] && MODULES="$MODULES core-ui"
          [ -d "version-catalogs/version-catalog-files" ] && MODULES="$MODULES files"
          [ -d "version-catalogs/version-catalog-notifications" ] && MODULES="$MODULES notifications"
          [ -d "version-catalogs/version-catalog-phonecore" ] && MODULES="$MODULES phone-core"
          [ -d "version-catalogs/version-catalog-camera" ] && MODULES="$MODULES camera"
          [ -d "version-catalogs/version-catalog-mediaplayers" ] && MODULES="$MODULES media-players"
          [ -d "version-catalogs/version-catalog-youtube" ] && MODULES="$MODULES youtube"
          [ -d "version-catalogs/version-catalog-phoneui" ] && MODULES="$MODULES phone-ui"
          [ -d "version-catalogs/version-catalog-imagepicker" ] && MODULES="$MODULES image-picker"

          git commit -m "Update versions to ${{ env.VERSION_PREFIX }}.${{ github.run_number }}${{ env.VERSION_SUFFIX }} for:$MODULES" || echo "No changes to commit"
          git push
