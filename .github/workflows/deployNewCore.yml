  # ============================================
  # FINALIZE: Merge version catalogs and commit
  # ============================================
  finalize:
    needs:
      - detect-changes
      - publish-core
      - publish-coreui
      - publish-files
      - publish-notifications
      - publish-phonecore
      - publish-camera
      - publish-mediaplayers
      - publish-youtube
      - publish-phoneui
      - publish-imagepicker
    if: always() && needs.detect-changes.outputs.any_module == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Download all version catalog artifacts
        uses: actions/download-artifact@v4
        with:
          path: version-catalogs
          pattern: version-catalog-*

      - name: Merge version catalogs
        run: |
          echo "Merging version catalogs..."

          # Start with the base version catalog
          cp gradle/libs.versions.toml gradle/libs.versions.toml.merged

          # Apply updates from each published module's artifact
          merge_version() {
            local module=$1
            local version_key=$2
            local artifact_path="version-catalogs/version-catalog-$module/libs.versions.toml"

            if [ -f "$artifact_path" ]; then
              # Extract the new version from the artifact
              NEW_VERSION=$(grep "$version_key = \"" "$artifact_path" | sed 's/.*= "\([^"]*\)".*/\1/')
              if [ -n "$NEW_VERSION" ]; then
                echo "Updating $version_key to $NEW_VERSION"
                sed -i '' "s/$version_key = \"[^\"]*\"/$version_key = \"$NEW_VERSION\"/" gradle/libs.versions.toml.merged
              fi
            fi
          }

          merge_version "core" "metacto-core"
          merge_version "coreui" "metacto-coreui"
          merge_version "files" "metacto-files"
          merge_version "notifications" "metacto-notifications"
          merge_version "phonecore" "metacto-phonecore"
          merge_version "camera" "metacto-camera"
          merge_version "mediaplayers" "metacto-mediaplayers"
          merge_version "youtube" "metacto-youtube"
          merge_version "phoneui" "metacto-phoneui"
          merge_version "imagepicker" "metacto-imagepicker"

          mv gradle/libs.versions.toml.merged gradle/libs.versions.toml

          echo "Updated version catalog:"
          head -30 gradle/libs.versions.toml

      - name: Update local properties
        env:
          PUBLISH_REPO_USER: ${{ secrets.PUBLISH_REPO_USER }}
          PUBLISH_REPO_TOKEN: ${{ secrets.PUBLISH_REPO_TOKEN }}
        run: |
          echo "PUBLISH_REPO_USER=$PUBLISH_REPO_USER" > ./local.properties
          echo "PUBLISH_REPO_TOKEN=$PUBLISH_REPO_TOKEN" >> ./local.properties

      - name: Publish version catalog
        run: ./gradlew :version-catalog:publishAllPublicationsToGithubRepository

      - name: Commit and push updated version catalog
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add gradle/libs.versions.toml

          # Build commit message with list of updated modules and their versions
          COMMIT_MSG="Update module versions:"

          if [ -d "version-catalogs/version-catalog-core" ]; then
            VER=$(grep 'metacto-core = "' gradle/libs.versions.toml | head -1 | sed 's/.*= "\([^"]*\)".*/\1/')
            COMMIT_MSG="$COMMIT_MSG core@$VER"
          fi
          if [ -d "version-catalogs/version-catalog-coreui" ]; then
            VER=$(grep 'metacto-coreui = "' gradle/libs.versions.toml | sed 's/.*= "\([^"]*\)".*/\1/')
            COMMIT_MSG="$COMMIT_MSG core-ui@$VER"
          fi
          if [ -d "version-catalogs/version-catalog-files" ]; then
            VER=$(grep 'metacto-files = "' gradle/libs.versions.toml | sed 's/.*= "\([^"]*\)".*/\1/')
            COMMIT_MSG="$COMMIT_MSG files@$VER"
          fi
          if [ -d "version-catalogs/version-catalog-notifications" ]; then
            VER=$(grep 'metacto-notifications = "' gradle/libs.versions.toml | sed 's/.*= "\([^"]*\)".*/\1/')
            COMMIT_MSG="$COMMIT_MSG notifications@$VER"
          fi
          if [ -d "version-catalogs/version-catalog-phonecore" ]; then
            VER=$(grep 'metacto-phonecore = "' gradle/libs.versions.toml | sed 's/.*= "\([^"]*\)".*/\1/')
            COMMIT_MSG="$COMMIT_MSG phone-core@$VER"
          fi
          if [ -d "version-catalogs/version-catalog-camera" ]; then
            VER=$(grep 'metacto-camera = "' gradle/libs.versions.toml | sed 's/.*= "\([^"]*\)".*/\1/')
            COMMIT_MSG="$COMMIT_MSG camera@$VER"
          fi
          if [ -d "version-catalogs/version-catalog-mediaplayers" ]; then
            VER=$(grep 'metacto-mediaplayers = "' gradle/libs.versions.toml | sed 's/.*= "\([^"]*\)".*/\1/')
            COMMIT_MSG="$COMMIT_MSG media-players@$VER"
          fi
          if [ -d "version-catalogs/version-catalog-youtube" ]; then
            VER=$(grep 'metacto-youtube = "' gradle/libs.versions.toml | sed 's/.*= "\([^"]*\)".*/\1/')
            COMMIT_MSG="$COMMIT_MSG youtube@$VER"
          fi
          if [ -d "version-catalogs/version-catalog-phoneui" ]; then
            VER=$(grep 'metacto-phoneui = "' gradle/libs.versions.toml | sed 's/.*= "\([^"]*\)".*/\1/')
            COMMIT_MSG="$COMMIT_MSG phone-ui@$VER"
          fi
          if [ -d "version-catalogs/version-catalog-imagepicker" ]; then
            VER=$(grep 'metacto-imagepicker = "' gradle/libs.versions.toml | sed 's/.*= "\([^"]*\)".*/\1/')
            COMMIT_MSG="$COMMIT_MSG image-picker@$VER"
          fi

          git commit -m "$COMMIT_MSG" || echo "No changes to commit"
          git push
