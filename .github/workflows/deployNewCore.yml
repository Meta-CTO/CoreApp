  # PUBLISH: MEDIA-PLAYERS
  # ============================================
  publish-mediaplayers:
    needs: detect-changes
    if: needs.detect-changes.outputs.mediaplayers == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Cache Konan
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan/caches
            ~/.konan/dependencies
            ~/.konan/kotlin-native-prebuilt-macos-*
          key: ${{ runner.os }}-konan-${{ hashFiles('**/Dependencies.kt') }}
          restore-keys: |
            ${{ runner.os }}-konan-
      - name: Get latest version from Maven
        id: version
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_REPO_TOKEN }}
        run: |
          PACKAGE_NAME="com.metacto.kmm.media-players"
          VERSIONS=$(gh api /orgs/Meta-CTO/packages/maven/$PACKAGE_NAME/versions --jq '.[].name' 2>/dev/null || echo "")

          if [ -z "$VERSIONS" ]; then
            CURRENT_VERSION=$(grep 'metacto-mediaplayers = "' gradle/libs.versions.toml | sed 's/.*= "\([^"]*\)".*/\1/')
            echo "No published versions found, using catalog version: $CURRENT_VERSION"
          else
            CURRENT_VERSION=$(echo "$VERSIONS" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-alpha$' | sort -V | tail -1)
            if [ -z "$CURRENT_VERSION" ]; then
              CURRENT_VERSION=$(grep 'metacto-mediaplayers = "' gradle/libs.versions.toml | sed 's/.*= "\([^"]*\)".*/\1/')
            fi
            echo "Latest published version: $CURRENT_VERSION"
          fi

          VERSION_BASE=$(echo "$CURRENT_VERSION" | sed 's/-[^-]*$//')
          MAJOR=$(echo "$VERSION_BASE" | cut -d. -f1)
          MINOR=$(echo "$VERSION_BASE" | cut -d. -f2)
          PATCH=$(echo "$VERSION_BASE" | cut -d. -f3)

          if [ -z "$PATCH" ]; then
            echo "ERROR: Failed to parse version. CURRENT_VERSION=$CURRENT_VERSION"
            exit 1
          fi

          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}${{ env.VERSION_SUFFIX }}"

          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
      - name: Update local properties
        env:
          PUBLISH_REPO_USER: ${{ secrets.PUBLISH_REPO_USER }}
          PUBLISH_REPO_TOKEN: ${{ secrets.PUBLISH_REPO_TOKEN }}
        run: |
          echo "PUBLISH_REPO_USER=$PUBLISH_REPO_USER" > ./local.properties
          echo "PUBLISH_REPO_TOKEN=$PUBLISH_REPO_TOKEN" >> ./local.properties
          echo "PUBLISH_CORE_VERSION=${{ steps.version.outputs.version }}" >> ./local.properties
      - name: Update version in catalog
        run: ./gradlew updateVersionCatalog_mediaplayers -PmoduleVersion=${{ steps.version.outputs.version }}
      - name: Publish media-players module
        run: ./gradlew :ui:media-players:publishAllPublicationsToGithubRepository
      - name: Upload updated version catalog
        uses: actions/upload-artifact@v4
        with:
          name: version-catalog-mediaplayers
          path: gradle/libs.versions.toml

