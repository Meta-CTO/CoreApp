name: Build & Publish Changed Modules

on:
  push:
    branches:
      - 'new_core'
    paths-ignore:
      - 'samples/**'
      - 'core/sample/**'
      - 'ui/sample/**'
      - '**.md'
      - '.gitignore'

env:
  VERSION_PREFIX: "0.2"
  VERSION_SUFFIX: "-alpha"

jobs:
  # ============================================
  # DETECT CHANGES
  # ============================================
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.changes.outputs.core }}
      coreui: ${{ steps.changes.outputs.coreui }}
      files: ${{ steps.changes.outputs.files }}
      notifications: ${{ steps.changes.outputs.notifications }}
      phonecore: ${{ steps.changes.outputs.phonecore }}
      camera: ${{ steps.changes.outputs.camera }}
      mediaplayers: ${{ steps.changes.outputs.mediaplayers }}
      youtube: ${{ steps.changes.outputs.youtube }}
      phoneui: ${{ steps.changes.outputs.phoneui }}
      imagepicker: ${{ steps.changes.outputs.imagepicker }}
      buildsrc: ${{ steps.changes.outputs.buildsrc }}
      any_module: ${{ steps.changes.outputs.any_module }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed modules
        id: changes
        run: |
          # Get changed files between current and previous commit
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo ""

          # Check buildSrc changes (triggers all modules)
          BUILDSRC_CHANGED=$(echo "$CHANGED_FILES" | grep -q '^buildSrc/' && echo 'true' || echo 'false')
          echo "buildsrc=$BUILDSRC_CHANGED" >> $GITHUB_OUTPUT

          # Detect per-module changes
          detect_module() {
            local module_name=$1
            local path_pattern=$2
            local changed=$(echo "$CHANGED_FILES" | grep -qE "$path_pattern" && echo 'true' || echo 'false')
            # If buildSrc changed, mark all modules as changed
            if [ "$BUILDSRC_CHANGED" = "true" ]; then
              changed="true"
            fi
            echo "$module_name=$changed" >> $GITHUB_OUTPUT
            echo "$module_name: $changed"
          }

          detect_module "core" "^core/core/"
          detect_module "coreui" "^ui/core-ui/"
          detect_module "files" "^core/files/"
          detect_module "notifications" "^core/notifications/"
          detect_module "phonecore" "^core/phone-core/"
          detect_module "camera" "^ui/camera/"
          detect_module "mediaplayers" "^ui/media-players/"
          detect_module "youtube" "^ui/youtube/"
          detect_module "phoneui" "^ui/phone-ui/"
          detect_module "imagepicker" "^ui/image-picker/"

          # Check if any module changed
          if [ "$BUILDSRC_CHANGED" = "true" ] || echo "$CHANGED_FILES" | grep -qE '^(core/(core|files|notifications|phone-core)|ui/(core-ui|camera|media-players|youtube|phone-ui|image-picker))/'; then
            echo "any_module=true" >> $GITHUB_OUTPUT
          else
            echo "any_module=false" >> $GITHUB_OUTPUT
          fi

  # ============================================
  # PUBLISH: CORE
  # ============================================
  publish-core:
    needs: detect-changes
    if: needs.detect-changes.outputs.core == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Cache Konan
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan/caches
            ~/.konan/dependencies
            ~/.konan/kotlin-native-prebuilt-macos-*
          key: ${{ runner.os }}-konan-${{ hashFiles('**/Dependencies.kt') }}
          restore-keys: |
            ${{ runner.os }}-konan-
      - name: Calculate version
        id: version
        run: echo "version=${{ env.VERSION_PREFIX }}.${{ github.run_number }}${{ env.VERSION_SUFFIX }}" >> $GITHUB_OUTPUT
      - name: Update local properties
        env:
          PUBLISH_REPO_USER: ${{ secrets.PUBLISH_REPO_USER }}
          PUBLISH_REPO_TOKEN: ${{ secrets.PUBLISH_REPO_TOKEN }}
        run: |
          echo "PUBLISH_REPO_USER=$PUBLISH_REPO_USER" > ./local.properties
          echo "PUBLISH_REPO_TOKEN=$PUBLISH_REPO_TOKEN" >> ./local.properties
          echo "PUBLISH_CORE_VERSION=${{ steps.version.outputs.version }}" >> ./local.properties
      - name: Update version in catalog
        run: ./gradlew updateVersionCatalog_core -PmoduleVersion=${{ steps.version.outputs.version }}
      - name: Publish core module
        run: ./gradlew :core:core:publishAllPublicationsToGithubRepository
      - name: Upload updated version catalog
        uses: actions/upload-artifact@v4
        with:
          name: version-catalog-core
          path: gradle/libs.versions.toml

