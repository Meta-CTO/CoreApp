			shellScript = "# Type a script or drag a script file from your workspace to insert its path.\n# Name of the resource to copy\nINFO_PLIST_FILE=GoogleService-Info.plist\n\n# Get references to debug and production versions of the plist file\nDEVELOPMENT_INFO_PLIST_FILE=${PROJECT_DIR}/${TARGET_NAME}/Configuration/Dev/${INFO_PLIST_FILE}\nPRODUCTION_INFO_PLIST_FILE=${PROJECT_DIR}/${TARGET_NAME}/Configuration/Prod/${INFO_PLIST_FILE}\n\n# Make sure the debug version exists\necho \"Looking for ${INFO_PLIST_FILE} in ${DEVELOPMENT_INFO_PLIST_FILE}\"\nif [ ! -f $DEVELOPMENT_INFO_PLIST_FILE ] ; then\n    echo \"File GoogleService-Info.plist (development) not found.\"\n    exit 1\nfi\n\n# Make sure the production version exists\necho \"Looking for ${INFO_PLIST_FILE} in ${PRODUCTION_INFO_PLIST_FILE}\"\nif [ ! -f $PRODUCTION_INFO_PLIST_FILE ] ; then\n    echo \"File GoogleService-Info.plist (production) not found.\"\n    exit 1\nfi\n\n# Get a reference to the destination location for the plist file\nPLIST_DESTINATION=${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app\necho \"Copying ${INFO_PLIST_FILE} to final destination: ${PLIST_DESTINATION}\"\n\n# Copy the appropiate file to app bundle\nif [ \"${CONFIGURATION}\" == \"Debug\" ] \nthen\n    echo \"File ${DEVELOPMENT_INFO_PLIST_FILE} copied\"\n    cp \"${DEVELOPMENT_INFO_PLIST_FILE}\" \"${PLIST_DESTINATION}\"\nelse\n    echo \"File ${PRODUCTION_INFO_PLIST_FILE} copied\"\n    cp \"${PRODUCTION_INFO_PLIST_FILE}\" \"${PLIST_DESTINATION}\"\nfi\n";
